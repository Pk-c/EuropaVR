; EuropaVR - reglages du chargeur.
; Ce fichier est lu par dsound.dll au demarrage du jeu.

; 0 = desactive completement le mod (le jeu demarre a plat, sans rien charger).
Enabled=1

; Runtime VR a charger : openxr_loader.dll ou openvr_api.dll
Runtime=openxr_loader.dll

; Neutralise les plugins VR natifs du moteur avant qu'il ne les touche.
Nullify=1

; Empeche UE4 de couper le son quand la fenetre du jeu perd le focus au profit
; de SteamVR. Ecrit [Audio] UnfocusedVolumeMultiplier=1.0 dans le Engine.ini du
; jeu (%LOCALAPPDATA%\Europa\Saved\Config\WindowsNoEditor\Engine.ini).
FixUnfocusedAudio=1

; Demarre avec le menu UEVR ferme au lieu de l'ouvrir a chaque lancement.
; Le menu reste accessible a tout moment : touche Inser, ou L3+R3 a la manette.
StartWithMenuClosed=1

; Temps max d'attente de la fenetre du jeu avant de charger UEVR quand meme.
WindowWaitTimeoutMs=120000

; Delai supplementaire apres l'apparition de la fenetre. C'est le reglage a
; augmenter si UEVR se charge trop tot et que le jeu crashe au demarrage.
PostWindowDelayMs=3000

; Incrementer pour forcer le re-deploiement du profil dans %APPDATA%
; (ecrase les reglages de l'utilisateur - ne bouger qu'a une vraie mise a jour).
ProfileVersion=1
