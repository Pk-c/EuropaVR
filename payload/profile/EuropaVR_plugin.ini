; EuropaVR - reglages du plugin C++.
; Relu automatiquement environ une fois par seconde : les valeurs s'appliquent
; en cours de partie, sans relancer le jeu.

; --- Placement de l'oeil -------------------------------------------------------
; ATTENTION : ces offsets s'AJOUTENT a ceux d'UEVR (menu Inser -> Camera Offset,
; cles VR_CameraForwardOffset / RightOffset / UpOffset dans config.txt).
; Le reglage par defaut place l'oeil au centre de la tete du personnage avec :
;     ici            ForwardOffset=12   UpOffset=0
;     + cote UEVR    Forward=2.437  Right=5.585  Up=1.184
; Les deux ne reagissent pas pareil au pitch : celui-ci reste horizontal (il suit
; uniquement le lacet), celui d'UEVR suit la direction du regard.
ForwardOffset=12
UpOffset=0

; --- Orientation du corps ------------------------------------------------------
; YawMethod : 0 = quaternion HMD (la seule qui mesure vraiment quelque chose ici),
;             1 = ecart inter-oculaire (renvoie zero sur ce jeu, conserve pour memoire)
YawMethod=0
; YawSign : -1 ou 1. A inverser si le personnage tourne a l'envers de ta tete.
YawSign=-1
; YawOffset : decalage constant en degres, si le corps est de travers.
YawOffset=0
ApplyBodyYaw=1
WriteViewRot=1

; --- Snap turn -----------------------------------------------------------------
SnapTurn=1
SnapAngle=45
SnapThreshold=0.5
SnapRelease=0.3
; Verrou en frames entre deux snaps. Descendre le rend plus nerveux, monter le
; rend plus sur. En dessous de ~10 il redevient difficile a doser.
SnapCooldown=18

; Frames entre deux lignes de diagnostic dans le log UEVR.
LogEvery=240
