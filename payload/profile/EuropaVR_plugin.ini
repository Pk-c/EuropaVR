; EuropaVR - C++ plugin settings.
; Re-read roughly once a second, so edits apply while the game is running.

; --- Eye placement -------------------------------------------------------------
; NOTE: these offsets ADD to UEVR's own (menu Insert -> Camera Offset, keys
; VR_CameraForwardOffset / RightOffset / UpOffset in config.txt).
; The defaults put the eye at the centre of the character's head with:
;     here          ForwardOffset=12   UpOffset=0
;     + UEVR side   Forward=2.437  Right=5.585  Up=1.184
; They do not behave identically in pitch: this one stays horizontal (it follows
; yaw only), while UEVR's follows the view direction.
ForwardOffset=12
UpOffset=0

; --- Body orientation ----------------------------------------------------------
; YawMethod: 0 = HMD pose quaternion (the only one that measures anything here),
;            1 = inter-eye delta (returns zero in this game, kept for the record)
YawMethod=0
; YawSign: -1 or 1. Flip it if the character turns the opposite way to your head.
YawSign=-1
; YawOffset: constant offset in degrees, if the body sits crooked.
YawOffset=0
ApplyBodyYaw=1
WriteViewRot=1

; --- Snap turn -----------------------------------------------------------------
SnapTurn=1
SnapAngle=45
SnapThreshold=0.5
SnapRelease=0.3
; Frames to wait between two snaps. Lower feels snappier, higher feels safer.
; Below about 10 it becomes hard to land a single step.
SnapCooldown=18

; Frames between two diagnostic lines in the UEVR log.
LogEvery=240
